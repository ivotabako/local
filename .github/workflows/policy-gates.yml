name: Policy Gates

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  policy-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run policy checks
        shell: pwsh
        run: |
          ./scripts/ci/Invoke-PolicyChecks.ps1
